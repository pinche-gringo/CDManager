# Publishes the documentation (doc/CDManager.html.*) to GitHub Pages
#
# The pages are available as
#   https://pinche-gringo.github.io/CDManager/        (english)
#   https://pinche-gringo.github.io/CDManager/de.html (german)
#   https://pinche-gringo.github.io/CDManager/es.html (spanish)
#
# Note: In the repository settings (Settings → Pages) "GitHub Actions" must be
# selected as source.

name: Documentation

on:
  push:
    paths:
      - 'doc/CDManager.html.*'
      - 'meson.build'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel a running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # @EMAIL@ in the documentation is substituted with email in meson.build
      - name: Create pages
        run: |
          EMAIL=$(sed -n "s/^ *email *= *'\([^']*\)'.*/\1/p" meson.build | head -n 1)
          if [ -z "$EMAIL" ]; then
            echo "email not found in meson.build"
            exit 1
          fi
          mkdir -p site
          for lang in en de es; do
            case "$lang" in
              en) target=index.html ;;
              *)  target="$lang.html" ;;
            esac
            sed "s/@EMAIL@/$EMAIL/g" "doc/CDManager.html.$lang" > "site/$target"
          done
          touch site/.nojekyll
          ls -l site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
